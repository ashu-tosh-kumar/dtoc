<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
  <title>dtoc Settings</title>
</head>
<body>
  <div class="header">
    <h1>dtoc for Confluence</h1>
  </div>

  <div class="content">
    <div class="setting-row">
      <label for="enable-toggle">Enable Extension</label>
      <label class="switch">
        <input type="checkbox" id="enable-toggle">
        <span class="slider round"></span>
      </label>
    </div>

    <div class="setting-row">
      <label for="position-select">TOC Position</label>
      <select id="position-select">
        <option value="left">Left</option>
        <option value="right">Right</option>
      </select>
    </div>

    <div class="setting-row" style="flex-direction: column; align-items: flex-start; gap: 8px;">
      <button id="restore-btn" class="btn">Show TOC</button>
      <small class="helper-text">Click to bring back the TOC if you closed it on the page.</small>
    </div>
  </div>

  <div class="footer">
    <p>Privacy First: No external calls, all data stays local.</p>
    <button id="request-support-btn" class="support-btn" title="Request support for website" style="display: none;">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
