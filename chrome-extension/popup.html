<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
  <title>DTOC Settings</title>
</head>
<body>
  <div class="header">
    <h1>
      DTOC <span class="subtitle">Dynamic Table of Contents</span>
      <span id="beta-badge" class="beta-badge" style="display: none;">Beta</span>
    </h1>
  </div>

  <div class="content">
    <!-- Quick toggles row -->
    <div class="quick-toggles">
      <button id="site-toggle-btn" class="site-toggle-btn" aria-pressed="true">
        <span id="site-toggle-status" class="status-icon" aria-hidden="true">✓</span>
        <span id="site-toggle-domain">This Site</span>
      </button>

      <div class="segmented-control global-control" role="group" aria-label="Global Extension State">
        <button id="global-on-btn" class="segment-btn" aria-pressed="true">On</button>
        <button id="global-off-btn" class="segment-btn" aria-pressed="false">Off</button>
      </div>
    </div>

    <!-- Detailed settings panel -->
    <div class="settings-panel">
      <!-- Theme Setting -->
      <div class="setting-row">
        <div class="setting-info">
          <div id="theme-label" class="setting-label">Theme</div>
          <div class="setting-desc">TOC sidebar color theme</div>
        </div>
        <div class="setting-control">
          <div class="segmented-control theme-control" role="group" aria-labelledby="theme-label">
            <button id="theme-auto-btn" class="segment-btn" aria-pressed="true">Auto</button>
            <button id="theme-light-btn" class="segment-btn" aria-pressed="false">Light</button>
            <button id="theme-dark-btn" class="segment-btn" aria-pressed="false">Dark</button>
          </div>
        </div>
      </div>

      <!-- TOC position -->
      <div class="setting-row">
        <div class="setting-info">
          <div id="position-label" class="setting-label">TOC Position</div>
          <div class="setting-desc">Where the TOC panel appears on screen</div>
        </div>
        <div class="setting-control">
          <div class="segmented-control position-control" role="group" aria-labelledby="position-label">
            <button id="position-left-btn" class="segment-btn" data-value="left" aria-pressed="true">Left</button>
            <button id="position-right-btn" class="segment-btn" data-value="right" aria-pressed="false">Right</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Only for Site filter button -->
    <div class="filter-action-container">
      <button id="only-for-btn" class="only-for-btn" aria-pressed="false">
        Only for <span id="only-for-domain">This Site</span>
      </button>
    </div>

    <!-- Restore TOC Action -->
    <div id="restore-container" class="helper-action-row" style="display: none;">
      <button id="restore-btn" class="btn btn-primary">Bring Back TOC</button>
      <small class="helper-text">Click to bring back the TOC if you closed it on the page.</small>
    </div>

    <!-- Support Action -->
    <div id="support-container" class="helper-action-row" style="display: none;">
      <button id="request-support-btn" class="btn btn-secondary">Request Website Support</button>
      <small class="helper-text">This website is not currently supported.</small>
    </div>

    <hr class="divider">

    <!-- Bottom Actions Row -->
    <div class="actions-row">
      <button id="reset-all-btn" class="btn btn-danger">Reset All</button>
      <button id="reset-site-btn" class="btn btn-outline">Reset Site</button>
    </div>
  </div>

  <div class="footer">
    <p>Privacy First: No external calls, all data stays local.</p>
    <p class="open-source-text">
      ❤️ Open source on <a href="https://github.com/ashu-tosh-kumar/dtoc" target="_blank" rel="noopener noreferrer">GitHub</a>
    </p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
